<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio Kawaii</title>
    <!-- Importação de fonte fofa do Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* Estilos Gerais (Reset e Fundo) */
        * {
            margin: 0;
            padding: 0;
            box-box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #ffeef8; /* Rosa bem claro */
            color: #5d4e6d; /* Roxo pastel para o texto */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container do Portfólio */
        .portfolio-card {
            background-color: #ffffff;
            border: 4px solid #ffb7db; /* Borda rosa pastel */
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 0px #ffb7db; /* Sombra sólida estilo cartoon */
        }

        /* Título Hello World */
        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: #ff7bbd; /* Rosa vibrante fofo */
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #ffe1f0;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Botão Kawaii */
        .btn-kawaii {
            background-color: #98eecc; /* Verde menta pastel */
            color: #3b7a60;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            padding: 15px 32px;
            border: 3px solid #3b7a60;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0px #3b7a60;
            display: inline-block;
            text-decoration: none;
        }

        /* Efeitos do Botão */
        .btn-kawaii:hover {
            background-color: #b4f8dd;
            transform: translateY(-2px);
            box-shadow: 0 8px 0px #3b7a60;
        }

        .btn-kawaii:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px #3b7a60;
        }

        /* Detalhe extra fofo */
        .carinha {
            font-size: 1.5rem;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <h1>Hello World!</h1>
        <p>Bem-vindo ao meu cantinho na internet. Eu sou um desenvolvedor em construção! (｡♥‿♥｡)</p>
        
        <!-- Botão Kawaii -->
        <button class="btn-kawaii" onclick="cliqueFofo()">
            Clique aqui! 
            <span class="carinha">≧◡≦</span>
        </button>
    </div>

    <script>
        // Função para dar vida ao botão
        function cliqueFofo() {
            alert("Obrigado pelo clique! Tenha um dia super mágico! ✨(★^O^★)");
        }
    </script>

</body>
</html>
